[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "derivative-valuation-fva-toolkit"
version = "1.0.0"
description = "Derivative Valuation & Fair Value Adjustment (XVA) Toolkit for Product Control & Quantitative Analytics"
readme = "README.md"
authors = [
    { name = "Amber Vats", email = "ambervats@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
